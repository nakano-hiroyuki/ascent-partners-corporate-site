<style>
:root{--font-heading:'Cormorant Garamond','Shippori Mincho',serif;--font-body:'Lora','Shippori Mincho',serif;
  /* white / blue / cool-grey re-grade: the system's ramps rebuilt in OKLCH at the
     same lightness steps, hue rotated to blue and the neutrals cooled. */
  --color-bg:#fff;
  --color-surface:oklch(0.978 0.007 250);
  --color-text:oklch(0.26 0.014 250);
  --color-divider:color-mix(in srgb, oklch(0.46 0.012 250) 22%, transparent);
  --color-neutral-100:oklch(0.975 0.004 250);
  --color-neutral-200:oklch(0.945 0.006 250);
  --color-neutral-300:oklch(0.885 0.008 250);
  --color-neutral-400:oklch(0.800 0.010 250);
  --color-neutral-500:oklch(0.685 0.010 250);
  --color-neutral-600:oklch(0.575 0.012 250);
  --color-neutral-700:oklch(0.460 0.012 250);
  --color-neutral-800:oklch(0.340 0.012 250);
  --color-neutral-900:oklch(0.245 0.012 250);
  --color-accent:oklch(0.560 0.125 250);
  --color-accent-100:oklch(0.960 0.020 250);
  --color-accent-200:oklch(0.910 0.040 250);
  --color-accent-300:oklch(0.855 0.060 250);
  --color-accent-400:oklch(0.775 0.080 250);
  --color-accent-500:oklch(0.685 0.110 250);
  --color-accent-600:oklch(0.585 0.130 250);
  --color-accent-700:oklch(0.475 0.120 250);
  --color-accent-800:oklch(0.360 0.100 250);
  --color-accent-900:oklch(0.260 0.070 250);
  --color-accent-2:oklch(0.560 0.125 250);
  --color-accent-2-100:oklch(0.960 0.020 250);
  --color-accent-2-200:oklch(0.910 0.040 250);
  --color-accent-2-300:oklch(0.855 0.060 250);
  --color-accent-2-400:oklch(0.775 0.080 250);
  --color-accent-2-500:oklch(0.685 0.110 250);
  --color-accent-2-600:oklch(0.585 0.130 250);
  --color-accent-2-700:oklch(0.475 0.120 250);
  --color-accent-2-800:oklch(0.360 0.100 250);
  --color-accent-2-900:oklch(0.260 0.070 250);}
body{margin:0;text-wrap:pretty;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-feature-settings:'lnum' 1;}
a{color:var(--color-accent-700);text-decoration:none;}
a:hover{color:var(--color-accent);}
.nav a[aria-current="page"]{color:var(--color-accent-700);box-shadow:inset 0 -1px 0 var(--color-accent);}
</style>

}
